  <!-- Mini legend -->
  <g filter="url(#shadow)">
    <rect x="1470" y="44" rx="14" ry="14" width="286" height="54" fill="#ffffff" stroke="#d5dce7" stroke-width="2"/>
  </g>
  <line x1="1492" y1="67" x2="1530" y2="67" stroke="#627086" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1542" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4f5a6d">control / data flow</text>
  <line x1="1660" y1="67" x2="1698" y2="67" stroke="#627086" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
  <text x="1709" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4f5a6d">prompt / notification linkage</text>
</svg>
